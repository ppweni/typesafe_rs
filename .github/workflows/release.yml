name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "typesafers") | .version')
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi
      - run: cargo test --workspace --all-features
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p typesafers
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
