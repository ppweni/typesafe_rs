[package]
name = "typesafe_rs"
version = "0.1.0"
edition = "2024"
description = "An idiomatic async Rust client for the TypeSafe AI API"
readme = "README.md"
license = "MIT"

[workspace]
members = ["examples/type-paranoid"]
resolver = "3"

[dependencies]
bytes = "1"
fastrand = "2"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "test-util"] }
