[package]
name = "typesafe_rs"
version = "0.2.0"
edition = "2024"
description = "An idiomatic async Rust client for the TypeSafe AI API"
readme = "README.md"
license = "MIT"
repository = "https://github.com/ppweni/typesafe_rs"

[workspace]
members = ["examples/type-paranoid"]
resolver = "3"

[features]
default = ["zstd"]
zstd = ["dep:zstd"]

[dependencies]
base64 = "0.22"
bytes = "1"
fastrand = "2"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "test-util"] }
